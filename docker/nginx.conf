events {
    worker_connections 1024;
}

http {
    upstream model_backend {
        server legal-rag-v1:8000 weight=9 max_fails=3 fail_timeout=10s;
        server legal-rag-v2:8000 weight=1 max_fails=3 fail_timeout=10s;
    }

    # Shadow / Mirror upstream (for dark traffic testing)
    upstream shadow_backend {
        server legal-rag-v2:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard client timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location / {
            proxy_pass http://model_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure upstream headers (such as X-Model-Version) pass to client
            proxy_pass_header X-Model-Version;
            add_header X-Proxy-By "LegalRAG-Nginx-Gateway" always;
        }

        # Optional shadow endpoint demonstrating asynchronous traffic mirroring
        location /ask/shadow {
            mirror /mirror_traffic;
            mirror_request_body on;
            proxy_pass http://legal-rag-v1:8000/ask;
            proxy_pass_header X-Model-Version;
        }

        location = /mirror_traffic {
            internal;
            proxy_pass http://shadow_backend/ask;
            proxy_pass_request_body on;
            proxy_set_header X-Shadow-Mode "true";
        }

        location /health {
            proxy_pass http://model_backend/health;
            proxy_pass_header X-Model-Version;
        }

        location /metadata {
            proxy_pass http://model_backend/metadata;
            proxy_pass_header X-Model-Version;
        }
    }
}
