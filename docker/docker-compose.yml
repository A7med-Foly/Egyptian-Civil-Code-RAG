services:
  legal-rag-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: legal-rag-api
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - API_PORT=8000
      - LLM_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
