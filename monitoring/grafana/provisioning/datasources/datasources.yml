apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 10s
      httpMethod: POST

  - name: PostgreSQL-Drift
    type: postgres
    uid: postgres-drift
    access: proxy
    url: postgres:5432
    user: mlflow
    secureJsonData:
      password: mlflowpassword
    jsonData:
      database: mlflow
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
    editable: true
