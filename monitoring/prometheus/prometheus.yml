global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    cluster: legal-rag-core

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/rules/recording.yml"
  - "/etc/prometheus/rules/alerts.yml"

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Legal RAG FastAPI / BentoML service with metric relabeling
  - job_name: "legal_rag_api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "host.docker.internal:8000"
          - "legal-rag-v1:8000"
          - "legal-rag-v2:8000"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: tier
        replacement: serving
    metric_relabel_configs:
      # Drop overly verbose Python GC stats to protect cardinality budget
      - source_labels: [__name__]
        regex: "python_gc_.*"
        action: drop

  # 3. Host Node Exporter (CPU, RAM, Disk, Network)
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # 4. Container Resource Metrics (cAdvisor)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [name]
        regex: "^$"
        action: drop

  # 5. Blackbox Exporter External HTTP Prober
  - job_name: "blackbox_http"
    metrics_path: "/probe"
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://host.docker.internal:8000/health"
          - "http://legal-rag-v1:8000/health"
          - "http://legal-rag-v2:8000/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"
